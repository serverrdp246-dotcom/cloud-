services:
  qemu:
    image: qemux/qemu
    container_name: qemu
    environment:
      BOOT: "ubuntu"
      USERNAME: "bill"
      PASSWORD: "gates"
      RAM_SIZE: "8G"       # زيادتها إلى 8 جيجابايت كحد أدنى لتشغيل المحاكي بداخل أوبونتو
      CPU_CORES: "4"       # تخصيص 4 أنوية
      DISK_SIZE: "64G"     # توفير مساحة كافية لتثبيت أندرويد ستوديو والـ SDK
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
    volumes:
      - ./qemu:/storage
    restart: always
    stop_grace_period: 2m
