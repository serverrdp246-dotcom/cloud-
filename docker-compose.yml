services:
  qemu:
    image: qemux/qemu
    container_name: qemu
    environment:
      BOOT: "ubuntu"
      USERNAME: "bill"
      PASSWORD: "gates"
      # تخصيص الموارد لضمان عمل Android Studio والمحاكي بأسلاسة
      CPU_CORES: "4"       # عدد أنوية المعالج (يمكنك زيادتها حسب جهازك)
      RAM_SIZE: "8G"       # حجم الذاكرة العشوائية (ينصح بـ 8GB على الأقل)
      DISK_SIZE: "64G"     # مساحة القرص الصلب للنظام والبرامج
    devices:
      - /dev/kvm           # أساسي لتشغيل KVM وتسريع محاكي أندرويد
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006          # واجهة التحكم بالنظام عبر المتصفح
      - 5555:5555          # منفذ ADB للربط الخارجي إذا احتجت ذلك
    volumes:
      - ./qemu:/storage
    restart: always
    stop_grace_period: 2m
